[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcmodeler"
version = "4.0.0"
description = "The modeler's client for SDCStudio: search the catalog, estimate, assemble and publish SDC4 data models, generate applications; a CLI and an MCP server over one client"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Axius SDC, Inc."},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
sdcmodeler = "sdcmodeler.cli:main"

[project.urls]
Repository = "https://github.com/Axius-SDC/sdcmodeler"
Documentation = "https://axius-sdc.com/docs/"
Issues = "https://github.com/Axius-SDC/sdcmodeler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
